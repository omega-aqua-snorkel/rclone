name: Run Build Script

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      count:
        required: true
        default: '1'

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.make-matrix.outputs.matrix }}
    steps:
      - id: make-matrix
        run: |
          COUNT=${{ github.event.inputs.count }}
          if ! [[ "$COUNT" =~ ^[0-9]+$ ]] || [ "$COUNT" -lt 1 ]; then
          COUNT=1
          fi
          NUMS=$(seq 1 "$COUNT" | paste -sd, -)
          echo "matrix=[${NUMS}]" >> $GITHUB_OUTPUT
  
  run_build_script:
    needs: build-matrix
    runs-on: ubuntu-latest

    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        idx: ${{ fromJson(needs.build-matrix.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: registry.gitlab.com
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run Bash script
        run: |
          docker run -e CONFIG_URL=${{ secrets.CONFIG_URL }} ${{ secrets.DOCKER_IMAGE }} 
